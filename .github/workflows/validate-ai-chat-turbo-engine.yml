name: Validate AI Chat Turbo Engine

on:
  push:
    branches:
      - "fix/**"
      - "feat/**"
    paths:
      - "scripts/ai-chat-turbo-engine.js"
      - ".github/workflows/validate-ai-chat-turbo-engine.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/ai-chat-turbo-engine.js"
      - ".github/workflows/validate-ai-chat-turbo-engine.yml"

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate userscript syntax
        run: node --check scripts/ai-chat-turbo-engine.js
