name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify affected userscripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the verification plan
        id: plan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "Base commit unavailable: verifying every workspace."
            pnpm exec tsx tools/ci-targets.ts --all
            exit 0
          fi
          git diff --name-only --diff-filter=ACDMRTUXB "$base_sha...HEAD" > changed-paths.txt
          cat changed-paths.txt
          pnpm exec tsx tools/ci-targets.ts --changed-file changed-paths.txt

      - name: Report the verification plan
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          TARGET_LIST: ${{ steps.plan.outputs.target_list }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "mode=$MODE"
          echo "targets=$TARGET_LIST"
          echo "reason=$REASON"

      - name: Typecheck shared tooling
        if: steps.plan.outputs.mode == 'full'
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Typecheck affected workspaces
        if: steps.plan.outputs.has_targets == 'true'
        shell: bash
        env:
          TARGET_LIST: ${{ steps.plan.outputs.target_list }}
        run: |
          set -euo pipefail
          for target in $TARGET_LIST; do
            echo "::group::tsc --noEmit scripts/$target"
            pnpm exec tsc --noEmit -p "scripts/$target/tsconfig.json"
            echo "::endgroup::"
          done

      - name: Unit tests
        if: steps.plan.outputs.mode == 'full'
        run: pnpm exec vitest run

      - name: Build affected bundles
        if: steps.plan.outputs.has_targets == 'true'
        shell: bash
        env:
          TARGET_LIST: ${{ steps.plan.outputs.target_list }}
        run: |
          set -euo pipefail
          for target in $TARGET_LIST; do
            echo "::group::build $target"
            pnpm exec tsx tools/build.ts --target="$target"
            node --check "dist/$target.user.js"
            pnpm exec tsx tools/verify-bundles.ts "dist/$target.user.js"
            echo "::endgroup::"
          done

      - name: Upload built userscripts
        if: steps.plan.outputs.has_targets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: userscripts
          path: dist/*.user.js
          if-no-files-found: error
          retention-days: 7

      - name: Deploy rebuilt bundles to release branch root
        if: |
          steps.plan.outputs.has_targets == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. 备份构建出的脚本文件并清理 Git 跟踪工作区
          TEMP_DIR=$(mktemp -d)
          cp -r dist/* "$TEMP_DIR/"
          git reset --hard HEAD
          git clean -fd

          # 2. 检出 release 分支
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch origin release
            git checkout -B release origin/release
          else
            echo "Release branch not found. Initializing orphan branch."
            git checkout --orphan release
            git rm -rf . 2>/dev/null || true
          fi

          # 3. 第一道防线：为 release 分支写入专有 .gitignore，彻底忽略依赖与缓存
          printf "node_modules/\n.pnpm-store/\n*.log\n" > .gitignore
          git add .gitignore

          # 4. 第二道防线：拷贝产物并只精确暂存 .user.js（及可选的 .meta.js）
          cp -r "$TEMP_DIR"/* .
          git add -f *.user.js
          if compgen -G "*.meta.js" > /dev/null; then
            git add -f *.meta.js
          fi

          # 5. 若已误提过 node_modules，从暂存区与索引中直接抹除
          if git ls-files --error-unmatch node_modules >/dev/null 2>&1; then
            git rm -r --cached node_modules
          fi

          # 6. 无实质变动则直接跳过
          if git diff --staged --quiet; then
            echo "Release branch root is already up to date, skipping commit."
            exit 0
          fi

          # 7. 提交并推送到 release 分支
          git commit -m "chore(release): update userscripts from ${{ github.sha }} [skip ci]"
          for i in 1 2 3; do
            if git push origin release; then
              echo "Successfully pushed to release branch."
              break
            fi
            echo "Push failed, pulling and retrying ($i/3)..."
            git pull --rebase origin release
          done
