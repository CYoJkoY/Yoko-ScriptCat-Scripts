name: Purge update channel cache

# 两个脚本的 @updateURL 都指向 jsDelivr 的 @main 分支地址。jsDelivr 对分支内容
# 有最长 12 小时的边缘缓存；不主动 purge 的话，ScriptCat 检查更新时会拿到旧文件，
# 表现为「明明推送了新版本却检测不到更新」。

on:
  push:
    branches:
      - main
    paths:
      - "scripts/gemini-quota-capsule.js"
      - "scripts/ai-chat-turbo-engine.js"
      - ".github/workflows/purge-jsdelivr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    name: Purge jsDelivr cache
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Purge jsDelivr edge cache
        run: |
          set -euo pipefail
          for path in scripts/gemini-quota-capsule.js scripts/ai-chat-turbo-engine.js; do
            echo "::group::purge ${path}"
            curl -fsS --max-time 30 --retry 3 --retry-delay 2 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${path}"
            echo
            echo "::endgroup::"
          done

      - name: Verify jsDelivr serves the pushed version
        run: |
          set -euo pipefail
          retry=0
          for path in scripts/gemini-quota-capsule.js scripts/ai-chat-turbo-engine.js; do
            want=$(grep -m1 '@version' "${path}" | awk '{print $3}')
            got=""
            for attempt in 1 2 3 4 5 6; do
              got=$(curl -fsS --max-time 30 \
                "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/${path}" \
                | grep -m1 '@version' | awk '{print $3}')
              if [ "${got}" = "${want}" ]; then
                break
              fi
              sleep 5
            done
            echo "${path}: pushed=${want} cdn=${got}"
            if [ "${got}" != "${want}" ]; then
              retry=1
            fi
          done
          exit "${retry}"
